<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>간단 정산 · 견적 계산기</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #059669;
      --success-soft: #ecfdf5;
      --danger: #dc2626;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      padding: 28px 16px 60px;
    }

    .app {
      max-width: 960px;
      margin: 0 auto;
    }

    .top-header {
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
    }

    .layout {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 6px 20px -12px rgba(15, 23, 42, 0.12);
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .mode-switch {
      display: flex;
      background: var(--surface-alt);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .mode-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--ink);
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* 항목 리스트 */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .item-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .ratio-row {
      display: grid;
      grid-template-columns: 1.3fr 0.8fr auto;
      gap: 8px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface-alt);
      color: var(--ink);
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn-outline {
      background: var(--surface);
      color: var(--ink);
      border: 1.5px solid var(--line);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-sm {
      padding: 7px 10px;
      font-size: 12px;
      border-radius: 8px;
    }

    .btn-icon {
      width: 36px;
      height: 38px;
      padding: 0;
      background: #fef2f2;
      color: var(--danger);
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
    }

    .btn-icon:hover {
      background: #fee2e2;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .summary-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--primary-soft);
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 12px 16px;
      margin-top: 14px;
    }

    .summary-strip .label {
      font-size: 13px;
      font-weight: 700;
      color: #1e40af;
    }

    .summary-strip .amount {
      font-size: 19px;
      font-weight: 800;
      color: var(--primary);
    }

    /* 결과 카드 */
    .result-box {
      background: var(--surface-alt);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .result-main-amount {
      font-size: 24px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .result-sub {
      font-size: 13px;
      color: var(--muted);
    }

    .member-results {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .member-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
    }

    .member-item .name {
      font-weight: 700;
    }

    .member-item .meta {
      font-size: 12px;
      color: var(--muted);
      margin-left: 6px;
    }

    .member-item .val {
      font-weight: 800;
      color: var(--primary);
    }

    textarea.notice-area {
      min-height: 230px;
      resize: vertical;
      line-height: 1.6;
      font-size: 13.5px;
      background: #fcfcfd;
    }

    .copy-feedback {
      font-size: 13px;
      font-weight: 700;
      color: var(--success);
      min-height: 20px;
      margin-top: 8px;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top-header">
      <span class="badge">SETTLEMENT &amp; ESTIMATE</span>
      <h1>간단 정산 · 견적 계산기</h1>
      <p class="subtitle">항목별 비용 또는 총액을 입력하고 인원·비율을 나누면 정산 금액과 안내 문구가 자동 생성됩니다.</p>
    </header>

    <div class="layout">
      <!-- 좌측: 입력 영역 -->
      <div>
        <section class="card">
          <div class="card-title">
            <span>1. 모임 · 행사 기본 정보</span>
          </div>
          <div class="field">
            <label for="event-title">정산 / 행사 제목</label>
            <input type="text" id="event-title" placeholder="예: 11월 팀 회식 정산 / 워크숍 견적 초안" oninput="updateAll()" />
          </div>
          <div class="field" style="margin-bottom: 0;">
            <label for="account-info">입금 계좌 / 안내 메모 (선택)</label>
            <input type="text" id="account-info" placeholder="예: 국민 123456-78-901234 홍길동" oninput="updateAll()" />
          </div>
        </section>

        <section class="card">
          <div class="card-title">
            <span>2. 비용 입력</span>
          </div>

          <div class="mode-switch">
            <button type="button" id="mode-items-btn" class="mode-btn active" onclick="setCostMode('items')">항목 여러 줄 추가</button>
            <button type="button" id="mode-total-btn" class="mode-btn" onclick="setCostMode('total')">총액 직접 입력</button>
          </div>

          <!-- 항목별 모드 -->
          <div id="cost-items-panel">
            <div id="item-list" class="item-list"></div>
            <div class="toolbar">
              <button type="button" class="btn btn-secondary btn-sm" onclick="addItemRow()">+ 항목 줄 추가</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="loadSampleItems()">예시 불러오기</button>
            </div>
          </div>

          <!-- 총액 직접 입력 모드 -->
          <div id="cost-total-panel" style="display: none;">
            <div class="field" style="margin-bottom: 0;">
              <label for="direct-total">총 금액 (원)</label>
              <input type="number" id="direct-total" min="0" step="100" value="120000" oninput="updateAll()" />
            </div>
          </div>

          <div class="summary-strip">
            <span class="label">합계 금액</span>
            <span id="total-display" class="amount">0원</span>
          </div>
        </section>

        <section class="card">
          <div class="card-title">
            <span>3. 인원 수 또는 비율 설정</span>
          </div>

          <div class="mode-switch">
            <button type="button" id="split-equal-btn" class="mode-btn active" onclick="setSplitMode('equal')">인원 수 (N분의 1)</button>
            <button type="button" id="split-ratio-btn" class="mode-btn" onclick="setSplitMode('ratio')">비율 배분</button>
          </div>

          <!-- 인원 수 모드 -->
          <div id="split-equal-panel">
            <div class="field">
              <label for="headcount">정산 인원 수 (명)</label>
              <input type="number" id="headcount" min="1" step="1" value="4" oninput="updateAll()" />
            </div>
          </div>

          <!-- 비율 배분 모드 -->
          <div id="split-ratio-panel" style="display: none;">
            <div id="ratio-list" class="item-list"></div>
            <div class="toolbar">
              <button type="button" class="btn btn-secondary btn-sm" onclick="addRatioRow()">+ 참여자/항목 추가</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="resetEqualRatio()">동일 비율 맞추기</button>
            </div>
            <p id="ratio-sum-hint" class="hint">비율 합계: 100</p>
          </div>

          <div class="row-2" style="margin-top: 14px;">
            <div class="field" style="margin-bottom: 0;">
              <label for="round-mode">원단위 계산 방식</label>
              <select id="round-mode" onchange="updateAll()">
                <option value="round">10원 단위 반올림</option>
                <option value="floor">10원 단위 내림</option>
                <option value="ceil">10원 단위 올림</option>
                <option value="exact1">1원 단위 내림</option>
              </select>
            </div>
            <div class="field" style="margin-bottom: 0;">
              <label for="adjust-first">단수 차액 처리</label>
              <select id="adjust-first" onchange="updateAll()">
                <option value="first">첫 번째 인원에 차액 반영</option>
                <option value="none">단순 계산 금액 그대로 표시</option>
              </select>
            </div>
          </div>
        </section>
      </div>

      <!-- 우측: 결과 및 안내 문구 -->
      <div>
        <section class="card">
          <div class="card-title">
            <span>계산 결과</span>
          </div>

          <div class="result-box">
            <div id="per-person-headline" class="result-main-amount">0원</div>
            <div id="per-person-sub" class="result-sub">총액 0원 기준</div>
          </div>

          <div id="member-results" class="member-results"></div>
        </section>

        <section class="card">
          <div class="card-title">
            <span>정산 안내 문구</span>
            <button type="button" class="btn btn-secondary btn-sm" onclick="buildNoticeText()">문구 새로고침</button>
          </div>
          <textarea id="notice-output" class="notice-area" readonly></textarea>
          <div class="toolbar">
            <button type="button" class="btn btn-primary" style="flex: 1;" onclick="copyNoticeText()">안내문 복사</button>
            <button type="button" class="btn btn-outline" onclick="clearAll()">초기화</button>
          </div>
          <div id="copy-status" class="copy-feedback"></div>
        </section>
      </div>
    </div>
  </div>

  <script>
    let costMode = 'items'; // 'items' | 'total'
    let splitMode = 'equal'; // 'equal' | 'ratio'

    const initialItems = [
      { name: '식사 비용', amount: 84000 },
      { name: '음료 및 디저트', amount: 26000 }
    ];

    const initialRatios = [
      { name: '참여자 1', ratio: 1 },
      { name: '참여자 2', ratio: 1 },
      { name: '참여자 3', ratio: 1 },
      { name: '참여자 4', ratio: 1 }
    ];

    function formatWon(num) {
      const safe = Number.isFinite(num) ? Math.round(num) : 0;
      return safe.toLocaleString('ko-KR') + '원';
    }

    function setCostMode(mode) {
      costMode = mode;
      document.getElementById('mode-items-btn').classList.toggle('active', mode === 'items');
      document.getElementById('mode-total-btn').classList.toggle('active', mode === 'total');
      document.getElementById('cost-items-panel').style.display = mode === 'items' ? 'block' : 'none';
      document.getElementById('cost-total-panel').style.display = mode === 'total' ? 'block' : 'none';
      updateAll();
    }

    function setSplitMode(mode) {
      splitMode = mode;
      document.getElementById('split-equal-btn').classList.toggle('active', mode === 'equal');
      document.getElementById('split-ratio-btn').classList.toggle('active', mode === 'ratio');
      document.getElementById('split-equal-panel').style.display = mode === 'equal' ? 'block' : 'none';
      document.getElementById('split-ratio-panel').style.display = mode === 'ratio' ? 'block' : 'none';
      updateAll();
    }

    function createItemRowElement(name = '', amount = '') {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <input type="text" class="item-name" placeholder="항목명 (예: 대관료, 식비)" value="${escapeAttr(name)}" oninput="updateAll()" />
        <input type="number" class="item-amount" placeholder="금액(원)" min="0" step="100" value="${amount}" oninput="updateAll()" />
        <button type="button" class="btn-icon" title="항목 삭제" onclick="removeRow(this)">×</button>
      `;
      return row;
    }

    function createRatioRowElement(name = '', ratio = 1) {
      const row = document.createElement('div');
      row.className = 'ratio-row';
      row.innerHTML = `
        <input type="text" class="ratio-name" placeholder="이름 또는 구분" value="${escapeAttr(name)}" oninput="updateAll()" />
        <input type="number" class="ratio-val" placeholder="비율" min="0" step="0.5" value="${ratio}" oninput="updateAll()" />
        <button type="button" class="btn-icon" title="항목 삭제" onclick="removeRow(this)">×</button>
      `;
      return row;
    }

    function escapeAttr(str) {
      return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    function addItemRow(name = '', amount = '') {
      document.getElementById('item-list').appendChild(createItemRowElement(name, amount));
      updateAll();
    }

    function addRatioRow(name = '', ratio = 1) {
      const list = document.getElementById('ratio-list');
      const nextNum = list.children.length + 1;
      list.appendChild(createRatioRowElement(name || `참여자 ${nextNum}`, ratio));
      updateAll();
    }

    function removeRow(btn) {
      const parent = btn.parentElement.parentElement;
      if (parent.children.length <= 1) {
        const inputs = btn.parentElement.querySelectorAll('input');
        inputs.forEach((inp, idx) => {
          inp.value = idx === 1 && parent.id === 'ratio-list' ? '1' : '';
        });
      } else {
        btn.parentElement.remove();
      }
      updateAll();
    }

    function loadSampleItems() {
      const list = document.getElementById('item-list');
      list.innerHTML = '';
      [
        { name: '장소 대관료', amount: 50000 },
        { name: '다과 · 음료비', amount: 32000 },
        { name: '현수막 · 출력물', amount: 18000 }
      ].forEach((it) => list.appendChild(createItemRowElement(it.name, it.amount)));
      updateAll();
    }

    function resetEqualRatio() {
      const rows = document.querySelectorAll('#ratio-list .ratio-row');
      rows.forEach((row) => {
        row.querySelector('.ratio-val').value = 1;
      });
      updateAll();
    }

    function getItemsData() {
      const rows = document.querySelectorAll('#item-list .item-row');
      const items = [];
      rows.forEach((row, idx) => {
        const name = row.querySelector('.item-name').value.trim() || `항목 ${idx + 1}`;
        const amount = Math.max(0, Number(row.querySelector('.item-amount').value) || 0);
        if (row.querySelector('.item-name').value.trim() !== '' || amount > 0) {
          items.push({ name, amount });
        }
      });
      return items;
    }

    function getTotalAmount(items) {
      if (costMode === 'total') {
        return Math.max(0, Number(document.getElementById('direct-total').value) || 0);
      }
      return items.reduce((sum, item) => sum + item.amount, 0);
    }

    function roundByMode(value, mode) {
      if (!Number.isFinite(value) || value <= 0) return 0;
      if (mode === 'round') return Math.round(value / 10) * 10;
      if (mode === 'floor') return Math.floor(value / 10) * 10;
      if (mode === 'ceil') return Math.ceil(value / 10) * 10;
      return Math.floor(value);
    }

    function calculateShares(total) {
      const roundMode = document.getElementById('round-mode').value;
      const adjustFirst = document.getElementById('adjust-first').value === 'first';

      if (splitMode === 'equal') {
        const count = Math.max(1, Math.floor(Number(document.getElementById('headcount').value) || 1));
        const rawShare = total / count;
        const baseShare = roundByMode(rawShare, roundMode);

        const shares = [];
        for (let i = 0; i < count; i++) {
          shares.push({
            label: `${i + 1}번 인원`,
            ratioLabel: `1/${count}`,
            amount: baseShare
          });
        }

        if (adjustFirst && shares.length > 0 && total > 0) {
          const sumOthers = shares.slice(1).reduce((s, x) => s + x.amount, 0);
          shares[0].amount = Math.max(0, total - sumOthers);
        }

        return {
          mode: 'equal',
          count,
          rawShare,
          baseShare,
          shares
        };
      } else {
        const rows = document.querySelectorAll('#ratio-list .ratio-row');
        const entries = [];
        rows.forEach((row, idx) => {
          const name = row.querySelector('.ratio-name').value.trim() || `참여자 ${idx + 1}`;
          const ratio = Math.max(0, Number(row.querySelector('.ratio-val').value) || 0);
          entries.push({ name, ratio });
        });

        const ratioSum = entries.reduce((s, e) => s + e.ratio, 0);
        document.getElementById('ratio-sum-hint').textContent = `입력된 비율 합계: ${ratioSum}`;

        if (ratioSum <= 0) {
          return {
            mode: 'ratio',
            count: entries.length,
            rawShare: 0,
            baseShare: 0,
            shares: entries.map((e) => ({
              label: e.name,
              ratioLabel: `비율 ${e.ratio}`,
              amount: 0
            }))
          };
        }

        const shares = entries.map((e) => {
          const exact = (total * e.ratio) / ratioSum;
          const pct = ((e.ratio / ratioSum) * 100).toFixed(1).replace(/\.0$/, '');
          return {
            label: e.name,
            ratioLabel: `${e.ratio} (${pct}%)`,
            amount: roundByMode(exact, roundMode)
          };
        });

        if (adjustFirst && shares.length > 0 && total > 0) {
          const sumOthers = shares.slice(1).reduce((s, x) => s + x.amount, 0);
          shares[0].amount = Math.max(0, total - sumOthers);
        }

        return {
          mode: 'ratio',
          count: entries.length,
          rawShare: 0,
          baseShare: shares[0] ? shares[0].amount : 0,
          shares
        };
      }
    }

    function updateAll() {
      const items = getItemsData();
      const total = getTotalAmount(items);
      document.getElementById('total-display').textContent = formatWon(total);

      const calc = calculateShares(total);
      const headlineEl = document.getElementById('per-person-headline');
      const subEl = document.getElementById('per-person-sub');
      const listEl = document.getElementById('member-results');

      if (calc.mode === 'equal') {
        headlineEl.textContent = `1인당 ${formatWon(calc.baseShare)}`;
        subEl.textContent = `총 ${formatWon(total)} ÷ ${calc.count}명`;
        listEl.innerHTML = calc.shares
          .map(
            (s) => `
            <div class="member-item">
              <div><span class="name">${escapeHtml(s.label)}</span><span class="meta">${escapeHtml(s.ratioLabel)}</span></div>
              <span class="val">${formatWon(s.amount)}</span>
            </div>
          `
          )
          .join('');
      } else {
        headlineEl.textContent = `총 ${formatWon(total)} (${calc.count}명/항목 배분)`;
        subEl.textContent = '비율에 따라 계산된 금액입니다.';
        listEl.innerHTML = calc.shares
          .map(
            (s) => `
            <div class="member-item">
              <div><span class="name">${escapeHtml(s.label)}</span><span class="meta">${escapeHtml(s.ratioLabel)}</span></div>
              <span class="val">${formatWon(s.amount)}</span>
            </div>
          `
          )
          .join('');
      }

      buildNoticeText(items, total, calc);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function buildNoticeText(items = getItemsData(), total = getTotalAmount(items), calc = calculateShares(total)) {
      const title = document.getElementById('event-title').value.trim() || '모임 정산 안내';
      const account = document.getElementById('account-info').value.trim();

      const lines = [];
      lines.push(`[${title}]`);
      lines.push('');

      if (costMode === 'items' && items.length > 0) {
        lines.push('■ 비용 내역');
        items.forEach((it) => {
          lines.push(`- ${it.name}: ${formatWon(it.amount)}`);
        });
        lines.push(`합계: ${formatWon(total)}`);
      } else {
        lines.push(`■ 총 금액: ${formatWon(total)}`);
      }

      lines.push('');
      lines.push('■ 정산 금액');

      if (calc.mode === 'equal') {
        lines.push(`- 정산 인원: ${calc.count}명`);
        const allSame = calc.shares.every((s) => s.amount === calc.shares[0].amount);
        if (allSame) {
          lines.push(`- 1인당 금액: ${formatWon(calc.shares[0].amount)}`);
        } else {
          calc.shares.forEach((s) => {
            lines.push(`- ${s.label}: ${formatWon(s.amount)}`);
          });
        }
      } else {
        calc.shares.forEach((s) => {
          lines.push(`- ${s.label} (${s.ratioLabel}): ${formatWon(s.amount)}`);
        });
      }

      if (account) {
        lines.push('');
        lines.push(`■ 입금 안내: ${account}`);
      }

      document.getElementById('notice-output').value = lines.join('\n');
    }

    function copyNoticeText() {
      const text = document.getElementById('notice-output').value;
      if (!text.trim()) return;
      navigator.clipboard.writeText(text).then(() => {
        const statusEl = document.getElementById('copy-status');
        statusEl.textContent = '정산 안내 문구가 클립보드에 복사되었습니다.';
        setTimeout(() => {
          statusEl.textContent = '';
        }, 3000);
      });
    }

    function clearAll() {
      document.getElementById('event-title').value = '';
      document.getElementById('account-info').value = '';
      document.getElementById('direct-total').value = '0';
      document.getElementById('headcount').value = '1';
      document.getElementById('item-list').innerHTML = '';
      document.getElementById('item-list').appendChild(createItemRowElement('', ''));
      document.getElementById('ratio-list').innerHTML = '';
      document.getElementById('ratio-list').appendChild(createRatioRowElement('참여자 1', 1));
      document.getElementById('ratio-list').appendChild(createRatioRowElement('참여자 2', 1));
      updateAll();
    }

    // 초기 화면 구성
    (function init() {
      const itemList = document.getElementById('item-list');
      initialItems.forEach((it) => itemList.appendChild(createItemRowElement(it.name, it.amount)));

      const ratioList = document.getElementById('ratio-list');
      initialRatios.forEach((r) => ratioList.appendChild(createRatioRowElement(r.name, r.ratio)));

      updateAll();
    })();
  </script>
</body>
</html>
