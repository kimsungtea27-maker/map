<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>랜덤 뽑기 &amp; 팀 나누기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f8fc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --accent: #e0115f;
      --accent-soft: #fde7ef;
      --success: #059669;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      min-height: 100vh;
      padding: 28px 16px 60px;
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
    }

    header {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px -12px rgba(15, 23, 42, 0.12);
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
    }

    .layout {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 6px 20px -12px rgba(15, 23, 42, 0.12);
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .count-pill {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .mode-switch {
      display: flex;
      background: var(--surface-alt);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
      gap: 4px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 12px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }

    textarea.list-input {
      width: 100%;
      min-height: 220px;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      color: var(--ink);
      background: #fcfcfd;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      resize: vertical;
      outline: none;
      line-height: 1.6;
    }

    textarea.list-input:focus {
      border-color: var(--primary);
      background: var(--surface);
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--ink);
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--primary);
    }

    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface-alt);
      padding: 11px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 14px;
      font-weight: 600;
    }

    .check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface-alt);
      color: var(--ink);
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn-outline {
      background: var(--surface);
      color: var(--ink);
      border: 1.5px solid var(--line);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-sm {
      padding: 7px 11px;
      font-size: 12px;
      border-radius: 8px;
    }

    .result-panel {
      min-height: 240px;
      background: var(--surface-alt);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .empty-msg {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 56px 16px;
    }

    .pick-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pick-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .rank-badge {
      min-width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .pick-name {
      font-size: 16px;
      font-weight: 800;
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
    }

    .team-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .team-header {
      font-size: 13px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
    }

    .team-members {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 14px;
      font-weight: 600;
    }

    .history-box {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
      font-size: 12px;
      color: var(--muted);
    }

    .copy-status {
      font-size: 13px;
      font-weight: 700;
      color: var(--success);
      min-height: 20px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <span class="badge">RANDOM PICK &amp; TEAM SPLIT</span>
      <h1>랜덤 뽑기 &amp; 팀 나누기</h1>
      <p class="subtitle">이름이나 항목을 줄바꿈으로 붙여 넣어 당첨자를 뽑거나 원하는 팀 수로 나눌 수 있습니다.</p>
    </header>

    <div class="layout">
      <!-- 좌측: 목록 및 설정 -->
      <div>
        <section class="card">
          <div class="card-title">
            <span>1. 이름 · 항목 목록 입력</span>
            <span id="item-count-pill" class="count-pill">0개 항목</span>
          </div>
          <textarea
            id="items-textarea"
            class="list-input"
            placeholder="한 줄에 한 명 또는 한 항목씩 입력하세요.&#10;예)&#10;김민준&#10;이서연&#10;박지호&#10;최수아"
            oninput="updateItemCount()"
          ></textarea>
          <div class="btn-row">
            <button type="button" class="btn btn-outline btn-sm" onclick="loadSampleList()">예시 목록 채우기</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="clearList()">목록 지우기</button>
          </div>
        </section>

        <section class="card">
          <div class="card-title"><span>2. 모드 및 옵션 설정</span></div>

          <div class="mode-switch">
            <button type="button" id="mode-pick-btn" class="mode-btn active" onclick="setMode('pick')">한 명 / 한 개 뽑기</button>
            <button type="button" id="mode-team-btn" class="mode-btn" onclick="setMode('team')">원하는 팀 수로 나누기</button>
          </div>

          <!-- 뽑기 옵션 -->
          <div id="pick-options">
            <div class="field">
              <label for="pick-count">이번에 뽑을 인원 / 항목 수</label>
              <input type="number" id="pick-count" min="1" step="1" value="1" />
            </div>
            <div class="check-row">
              <label class="check-label" for="exclude-picked">
                <input type="checkbox" id="exclude-picked" checked />
                <span>이미 뽑힌 항목 중복 제외</span>
              </label>
              <button type="button" class="btn btn-secondary btn-sm" onclick="resetPickedPool()">제외 기록 초기화</button>
            </div>
          </div>

          <!-- 팀 나누기 옵션 -->
          <div id="team-options" style="display: none;">
            <div class="field">
              <label for="team-count">나눌 팀 수 (개)</label>
              <input type="number" id="team-count" min="2" step="1" value="2" />
            </div>
          </div>

          <div class="btn-row">
            <button type="button" id="run-btn" class="btn btn-primary" style="flex: 1;" onclick="runAction()">뽑기 실행</button>
            <button type="button" id="rerun-btn" class="btn btn-outline" onclick="runAction()">결과 다시 뽑기</button>
          </div>
        </section>
      </div>

      <!-- 우측: 결과 및 복사 -->
      <div>
        <section class="card">
          <div class="card-title">
            <span id="result-title">추첨 결과</span>
            <span id="remain-pill" class="count-pill">대기 중</span>
          </div>

          <div id="result-panel" class="result-panel">
            <div class="empty-msg">왼쪽에 목록을 입력하고 실행 버튼을 눌러 주세요.</div>
          </div>

          <div class="btn-row">
            <button type="button" class="btn btn-primary" style="flex: 1;" onclick="copyResult()">결과 복사</button>
            <button type="button" class="btn btn-outline" onclick="clearResult()">결과 지우기</button>
          </div>
          <div id="copy-status" class="copy-status"></div>
        </section>
      </div>
    </div>
  </div>

  <script>
    let currentMode = 'pick'; // 'pick' | 'team'
    let excludedSet = new Set();
    let lastPlainText = '';

    const sampleNames = [
      '김하준', '이서윤', '박도윤', '최지안',
      '정시우', '강하윤', '조은우', '윤아린'
    ];

    function getLines() {
      return document
        .getElementById('items-textarea')
        .value.split(/\r?\n/)
        .map((line) => line.trim())
        .filter((line) => line.length > 0);
    }

    function updateItemCount() {
      const lines = getLines();
      document.getElementById('item-count-pill').textContent = `${lines.length}개 항목`;
      syncRemainBadge(lines);
    }

    function syncRemainBadge(lines = getLines()) {
      const remainPill = document.getElementById('remain-pill');
      if (currentMode === 'team') {
        const tCount = Math.max(2, Math.floor(Number(document.getElementById('team-count').value) || 2));
        remainPill.textContent = `${tCount}개 팀 배정`;
      } else {
        const exclude = document.getElementById('exclude-picked').checked;
        if (!exclude) {
          remainPill.textContent = `전체 ${lines.length}개 대상`;
        } else {
          const remaining = lines.filter((item) => !excludedSet.has(item)).length;
          remainPill.textContent = `남은 후보 ${remaining}개`;
        }
      }
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('mode-pick-btn').classList.toggle('active', mode === 'pick');
      document.getElementById('mode-team-btn').classList.toggle('active', mode === 'team');
      document.getElementById('pick-options').style.display = mode === 'pick' ? 'block' : 'none';
      document.getElementById('team-options').style.display = mode === 'team' ? 'block' : 'none';
      document.getElementById('result-title').textContent = mode === 'pick' ? '추첨 결과' : '팀 나누기 결과';
      document.getElementById('run-btn').textContent = mode === 'pick' ? '뽑기 실행' : '팀 나누기 실행';
      syncRemainBadge();
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function resetPickedPool() {
      excludedSet.clear();
      syncRemainBadge();
      showCopyStatus('중복 제외 기록이 초기화되었습니다.');
    }

    function runAction() {
      const lines = getLines();
      const panel = document.getElementById('result-panel');

      if (lines.length === 0) {
        panel.innerHTML = '<div class="empty-msg">뽑거나 나눌 항목을 한 줄 이상 입력해 주세요.</div>';
        lastPlainText = '';
        return;
      }

      if (currentMode === 'pick') {
        executePick(lines, panel);
      } else {
        executeTeamSplit(lines, panel);
      }

      syncRemainBadge(lines);
    }

    function executePick(lines, panel) {
      const pickCount = Math.max(1, Math.floor(Number(document.getElementById('pick-count').value) || 1));
      const exclude = document.getElementById('exclude-picked').checked;

      let pool = exclude ? lines.filter((item) => !excludedSet.has(item)) : [...lines];

      if (pool.length === 0) {
        panel.innerHTML = '<div class="empty-msg">남은 후보가 없습니다. [제외 기록 초기화]를 눌러 다시 시작해 주세요.</div>';
        lastPlainText = '';
        return;
      }

      const shuffled = shuffleArray(pool);
      const selected = shuffled.slice(0, Math.min(pickCount, shuffled.length));

      if (exclude) {
        selected.forEach((item) => excludedSet.add(item));
      }

      panel.innerHTML = `
        <div class="pick-list">
          ${selected
            .map(
              (name, idx) => `
              <div class="pick-item">
                <span class="rank-badge">${idx + 1}</span>
                <span class="pick-name">${escapeHtml(name)}</span>
              </div>
            `
            )
            .join('')}
        </div>
        <div class="history-box">
          ${exclude ? `누적 제외 항목 (${excludedSet.size}개): ${escapeHtml(Array.from(excludedSet).join(', '))}` : '중복 허용 추첨 모드'}
        </div>
      `;

      lastPlainText = [
        '[랜덤 뽑기 결과]',
        ...selected.map((name, idx) => `${idx + 1}. ${name}`)
      ].join('\n');
    }

    function executeTeamSplit(lines, panel) {
      const teamCount = Math.max(2, Math.floor(Number(document.getElementById('team-count').value) || 2));
      const actualTeams = Math.min(teamCount, lines.length);
      const shuffled = shuffleArray(lines);

      const teams = Array.from({ length: actualTeams }, () => []);
      shuffled.forEach((item, idx) => {
        teams[idx % actualTeams].push(item);
      });

      panel.innerHTML = `
        <div class="teams-grid">
          ${teams
            .map(
              (members, idx) => `
              <div class="team-card">
                <div class="team-header">
                  <span>${idx + 1}팀</span>
                  <span>${members.length}명</span>
                </div>
                <ul class="team-members">
                  ${members.map((m) => `<li>· ${escapeHtml(m)}</li>`).join('')}
                </ul>
              </div>
            `
            )
            .join('')}
        </div>
      `;

      const textLines = ['[팀 나누기 결과]'];
      teams.forEach((members, idx) => {
        textLines.push(`${idx + 1}팀 (${members.length}명): ${members.join(', ')}`);
      });
      lastPlainText = textLines.join('\n');
    }

    function copyResult() {
      if (!lastPlainText.trim()) {
        showCopyStatus('복사할 결과가 없습니다. 먼저 뽑기 또는 팀 나누기를 실행해 주세요.');
        return;
      }
      navigator.clipboard.writeText(lastPlainText).then(() => {
        showCopyStatus('결과가 클립보드에 복사되었습니다.');
      });
    }

    function clearResult() {
      lastPlainText = '';
      document.getElementById('result-panel').innerHTML =
        '<div class="empty-msg">왼쪽에 목록을 입력하고 실행 버튼을 눌러 주세요.</div>';
      showCopyStatus('결과를 지웠습니다.');
    }

    function clearList() {
      document.getElementById('items-textarea').value = '';
      excludedSet.clear();
      updateItemCount();
    }

    function loadSampleList() {
      document.getElementById('items-textarea').value = sampleNames.join('\n');
      excludedSet.clear();
      updateItemCount();
    }

    function showCopyStatus(msg) {
      const el = document.getElementById('copy-status');
      el.textContent = msg;
      setTimeout(() => {
        el.textContent = '';
      }, 2800);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    (function init() {
      loadSampleList();
      runAction();
    })();
  </script>
</body>
</html>
